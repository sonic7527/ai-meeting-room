<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Meeting Room</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#fbfaf7; --ink:#1c2026; --ink-2:#454c57; --ink-3:#757c87; --hair:#d9d6cd;
  --me:#2b5797; --me-bg:#e3eaf6; --Claude:#b0532c; --Claude-bg:#f6e8df; --GPT:#12775a; --GPT-bg:#dff0e8;
  --Gemini:#5b4bc4; --Gemini-bg:#e9e6fa; --sys:#6d6a62; --sum:#7a5a12; --sum-bg:#f6edd2; --danger:#b3362b; --warn:#b26b00;
  --f:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16181c; --panel:#1e2126; --ink:#ecebe7; --ink-2:#c3c6cc; --ink-3:#8e939c; --hair:#323740;
  --me:#9dbcf2; --me-bg:#1c2638; --Claude:#f0a57f; --Claude-bg:#2e221c; --GPT:#6fd6ae; --GPT-bg:#16291f;
  --Gemini:#b3a8ff; --Gemini-bg:#221f38; --sys:#9a978f; --sum:#e8c877; --sum-bg:#2b2515; --danger:#f08378; --warn:#f0b65c;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.75;display:flex}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;font-weight:700;padding:10px 18px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--me);outline-offset:2px}
.primary{background:var(--me);color:#fff}
.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--hair)}
.danger{background:transparent;color:var(--danger);border:1px solid currentColor}

aside{width:300px;flex:0 0 300px;border-right:1px solid var(--hair);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .top{padding:18px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--hair)}
aside h1{margin:0;font-size:23px;letter-spacing:.03em}
.langs{display:flex;gap:6px}
.langs button{padding:4px 10px;font-size:14px;font-weight:600;background:transparent;color:var(--ink-3);border:1px solid var(--hair)}
.langs button.on{background:var(--me-bg);color:var(--me)}
.list{overflow:auto;flex:1;padding:8px}
.item{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);font-weight:500;padding:10px 12px;border-radius:8px}
.item small{display:block;color:var(--ink-3);font-size:14px;font-weight:400}
.item.on{background:var(--me-bg)} .item.closed{opacity:.6}

main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
header{padding:14px 24px;border-bottom:1px solid var(--hair);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
header h2{margin:0;font-size:24px;flex:1 1 260px;min-width:0}
.seats{display:flex;flex-wrap:wrap;gap:8px}
.seat{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;padding:4px 12px;border-radius:99px;border:1px solid var(--hair)}
.seat i{width:11px;height:11px;border-radius:50%;background:var(--ink-3)}
.seat small{font-weight:500;color:var(--ink-3);font-size:14px}
.seat.listening i{background:var(--GPT)}
.seat.thinking i{background:#d9a12b;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.seat.thinking i{animation:none}}
.info{padding:8px 24px;border-bottom:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--ink-2)}
.info b{color:var(--ink)}
.topic{margin:0;padding:12px 24px;border-bottom:1px solid var(--hair);color:var(--ink-2);white-space:pre-wrap;font-size:17px;max-height:9em;overflow:auto}
.log{flex:1;overflow:auto;padding:20px 24px 30px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:900px;min-width:0}
.meta{display:flex;gap:10px;align-items:baseline}
.who{font-weight:800;font-size:17px}
.time{font-size:14px;color:var(--ink-3)}
.body{padding:12px 16px;border-radius:4px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel)}
.m-Claude .who{color:var(--Claude)} .m-Claude .body{background:var(--Claude-bg)}
.m-GPT .who{color:var(--GPT)} .m-GPT .body{background:var(--GPT-bg)}
.m-Gemini .who{color:var(--Gemini)} .m-Gemini .body{background:var(--Gemini-bg)}
.m-user{align-self:flex-end;align-items:flex-end} .m-user .who{color:var(--me)}
.m-user .body{background:var(--me-bg);border-radius:14px 4px 14px 14px}
.m-system{align-self:center;max-width:100%} .m-system .meta{display:none}
.m-system .body{background:transparent;color:var(--sys);font-size:15px;padding:2px 8px;text-align:center}
.body.sum{background:var(--sum-bg)!important;border:1px solid color-mix(in srgb,var(--sum) 40%,transparent)}
.body img{display:block;max-width:100%;max-height:520px;margin-top:10px;border-radius:10px;border:1px solid var(--hair)}
.ack{display:flex;flex-wrap:wrap;gap:10px;font-size:14px}
.ack .ok{color:var(--GPT)} .ack .wait{color:var(--warn);font-weight:700}
.empty{margin:auto;text-align:center;color:var(--ink-3)}
footer{border-top:1px solid var(--hair);padding:12px 24px;display:flex;gap:10px;align-items:flex-end;background:var(--panel)}
footer textarea{flex:1;min-width:0;resize:none;min-height:56px;max-height:220px;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);color:var(--ink)}
.note{padding:0 24px 10px;font-size:14px;color:var(--ink-3);background:var(--panel)}

dialog{border:1px solid var(--hair);border-radius:16px;background:var(--panel);color:var(--ink);width:min(760px,94vw);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 14px;font-size:22px}
dialog label.f{display:block;font-weight:700;margin:12px 0 6px}
dialog input[type=text],dialog textarea,select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--hair);background:var(--bg);color:var(--ink)}
dialog textarea{min-height:160px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.invite{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
fieldset{border:1px solid var(--hair);border-radius:12px;padding:6px 14px 14px;margin:0;min-width:0}
fieldset.off{opacity:.55}
legend{padding:0 6px}
label.chk{display:flex;align-items:center;gap:8px;font-weight:800}
fieldset .hint{font-size:14px;color:var(--ink-3);margin:6px 0 0}
fieldset label.s{display:block;font-size:15px;color:var(--ink-2);margin:8px 0 4px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.err{color:var(--danger);min-height:1.5em;margin-top:8px}
@media (max-width:820px){body{flex-direction:column}aside{width:auto;flex:0 0 auto;max-height:34vh;border-right:0;border-bottom:1px solid var(--hair)}
  header,.topic,.log,footer,.note,.info{padding-left:16px;padding-right:16px}.two{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<aside>
  <div class="top">
    <h1 data-t="app"></h1>
    <div class="langs"><button id="l-en">English</button><button id="l-zh">中文</button></div>
    <button class="primary" id="newBtn" data-t="new"></button>
  </div>
  <div class="list" id="list"></div>
</aside>
<main>
  <header>
    <h2 id="title" data-t="pick"></h2>
    <div class="seats" id="seats"></div>
    <button class="ghost" id="cfgBtn" hidden data-t="models"></button>
    <button class="ghost" id="recall" hidden data-t="recall"></button>
    <button class="danger" id="closeBtn" hidden data-t="close"></button>
  </header>
  <div class="info" id="info" hidden></div>
  <p class="topic" id="topic" hidden></p>
  <div class="log" id="log"><div class="empty" data-t="emptyLog"></div></div>
  <footer><textarea id="say" disabled></textarea><button class="primary" id="send" disabled data-t="send"></button></footer>
  <div class="note" id="note"></div>
</main>

<dialog id="dlg"><form id="form" method="dialog">
  <h3 data-t="new"></h3>
  <label class="f" for="f-title" data-t="titleL"></label><input type="text" id="f-title" maxlength="60" required>
  <label class="f" for="f-proj" data-t="projL"></label><select id="f-proj"></select>
  <input type="text" id="f-proj-other" hidden style="margin-top:8px">
  <div class="two">
    <div><label class="f" for="f-mode" data-t="modeL"></label><select id="f-mode"></select></div>
    <div><label class="f" for="f-lang" data-t="langL"></label><select id="f-lang"><option value="en">English</option><option value="zh-TW">繁體中文</option></select></div>
  </div>
  <label class="f" data-t="inviteL"></label>
  <div class="invite" id="invite"></div>
  <label class="f" for="f-lead" data-t="leadL"></label><select id="f-lead"></select>
  <label class="f" for="f-topic" data-t="topicL"></label><textarea id="f-topic" required></textarea>
  <div class="err" id="f-err"></div>
  <div class="acts"><button type="button" class="ghost" id="cancel" data-t="cancel"></button><button type="submit" class="primary" id="go" data-t="start"></button></div>
</form></dialog>

<dialog id="dlg2"><form id="form2" method="dialog">
  <h3 data-t="models"></h3>
  <p style="margin:0;color:var(--ink-2);font-size:16px" data-t="modelsNote"></p>
  <div class="invite" id="cfgSeats"></div>
  <div class="err" id="c-err"></div>
  <div class="acts"><button type="button" class="ghost" id="cancel2" data-t="cancel"></button><button type="submit" class="primary" id="go2" data-t="apply"></button></div>
</form></dialog>

<script>
const I18N={
 en:{app:"AI Meeting Room",new:"New meeting",pick:"Pick a meeting on the left, or start a new one",models:"Change models",recall:"Bring back",close:"Close meeting",
   closeSure:"Close? Click again",emptyLog:"Messages from you and the AIs will appear here.",send:"Send",say:"Speak as the host… (Ctrl+Enter to send)",
   titleL:"Title",projL:"Project (every AI reads the same folder)",other:"Other folder…",otherPh:"Full path, e.g. /home/me/my-project",
   modeL:"Meeting type",langL:"Meeting language",inviteL:"Invite (detected on this computer)",leadL:"Lead",topicL:"Topic (background, constraints, what to decide)",
   topicPh:"Write down the constraints you have already decided; the AIs will follow them.",cancel:"Cancel",start:"Start meeting",apply:"Apply",
   modelsNote:"Only the AI you change rejoins with the new model; it reads the earlier messages and continues.",
   model:"Model",effort:"Reasoning effort",dflt:"default",notInstalled:"Not installed",notSigned:"Not signed in",
   allowBtn:"Allow meeting tools",allowNote:"Antigravity CLI runs in the background and cannot ask for permission. This adds one rule to its settings that allows only the meeting-room tools.",
   modes:{discuss:"Discussion",review:"Code review"},equal:"No lead — equal discussion (all read-only)",leads:n=>n+" leads (edits code in an isolated git copy)",
   state:{listening:"listening",thinking:"thinking",away:"away"},host:"Host",system:"System",
   info:{project:"Project",type:"Type",role:"Roles",copy:"Lead's copy"},replied:" replied",pending:" pending",
   noteLive:"The AIs speak for themselves here; interject any time and they answer you first.",
   noteRun:(n)=>"The AIs have sent "+n+" messages in a row and are waiting for you.",
   noteClosed:"Closed. The AIs are leaving; the record will be saved into the project's docs/meetings/.",
   noteSaved:p=>"Closed. Record saved to: "+p,noServer:"Cannot reach the meeting server: ",needAI:"Invite at least one AI.",
   meetings:{open:"open",closed:"closed",msgs:" msgs"},none:"No meetings yet"},
 "zh-TW":{app:"AI 會議室",new:"開新會議",pick:"請從左邊選一場會議,或開新會議",models:"換模型",recall:"請回席",close:"散會",
   closeSure:"確定散會?再按一次",emptyLog:"會議開始後,大家的發言會依序出現在這裡。",send:"送出",say:"以主持人身分發言…(Ctrl+Enter 送出)",
   titleL:"標題",projL:"專案(所有 AI 讀同一個資料夾)",other:"其他資料夾…",otherPh:"輸入資料夾完整路徑,例:D:\\my-project",
   modeL:"會議類型",langL:"會議語言",inviteL:"邀請(自動偵測這台電腦裝了哪些)",leadL:"誰當主審",topicL:"議題說明(背景、限制、要討論出什麼)",
   topicPh:"把你已經決定的限制寫清楚,AI 會照著討論。",cancel:"取消",start:"開會",apply:"套用",
   modelsNote:"只有改到的那位 AI 會換新模型重新入席,並讀完前面的紀錄接著討論。",
   model:"模型",effort:"思考深度",dflt:"預設",notInstalled:"未安裝",notSigned:"尚未登入",
   allowBtn:"允許會議室工具",allowNote:"Antigravity 命令列程式在背景執行時無法跳出詢問,需要在它的設定裡加一條規則,只允許會議室的工具。",
   modes:{discuss:"討論",review:"互相檢查程式碼"},equal:"平等討論(大家都只能看)",leads:n=>n+" 主審(在獨立副本改程式)",
   state:{listening:"在聽",thinking:"思考中",away:"不在席"},host:"主持人",system:"系統",
   info:{project:"專案",type:"類型",role:"角色",copy:"主審副本"},replied:" 已回應",pending:" 待回應",
   noteLive:"AI 會在這裡各自發言;你隨時可以插話,他們會先回應你。",
   noteRun:(n)=>"AI 已連講 "+n+" 則,正在等你發言。",
   noteClosed:"已散會,AI 退場中,紀錄稍後存回專案的 docs/meetings/。",
   noteSaved:p=>"已散會,紀錄已存到:"+p,noServer:"連不到會議室伺服器:",needAI:"至少邀請一位 AI。",
   meetings:{open:"進行中",closed:"已散會",msgs:" 則"},none:"還沒有會議"}};
const EFF={en:{"":"default",low:"low",medium:"medium",high:"high",xhigh:"x-high",max:"max",ultra:"ultra"},
  "zh-TW":{"":"預設",low:"低",medium:"中",high:"高",xhigh:"更高",max:"最高",ultra:"極限"}};
const ALL=["Claude","GPT","Gemini"];
const $=id=>document.getElementById(id);
let LANG=(navigator.language||"").startsWith("zh")?"zh-TW":"en";
try{const saved=localStorage.getItem("amr-lang");if(saved in I18N)LANG=saved;}catch(e){}
const L=()=>I18N[LANG];
let cur=null,last=0,timer=null,closed=false,MODELS=null,AGENTS=null,curMeta=null,curSeats=[];
const SEQS={};

function applyLang(){
  document.documentElement.lang=LANG;document.title=L().app;
  document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(typeof L()[k]==="string")el.textContent=L()[k];});
  $("say").placeholder=L().say;$("f-topic").placeholder=L().topicPh;$("f-proj-other").placeholder=L().otherPh;
  $("l-en").classList.toggle("on",LANG==="en");$("l-zh").classList.toggle("on",LANG!=="en");
  opt($("f-mode"),[["discuss",L().modes.discuss],["review",L().modes.review]],$("f-mode").value||"discuss");
  if(cur){const c=cur;cur=null;open(c);}else{$("note").textContent=L().noteLive;}
  loadList();
}
function setLang(l){LANG=l;try{localStorage.setItem("amr-lang",l);}catch(e){}applyLang();}
$("l-en").onclick=()=>setLang("en");$("l-zh").onclick=()=>setLang("zh-TW");

async function api(path,o){const r=await fetch(path,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;}
const post=(path,body)=>api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
function hm(iso){try{return new Date(iso).toLocaleTimeString(LANG,{hour:"2-digit",minute:"2-digit",hour12:false});}catch(e){return"";}}
function opt(sel,items,val){sel.textContent="";for(const[v,t]of items){const o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o);}sel.value=val;if(sel.value!==val&&sel.options.length)sel.selectedIndex=0;}
const R=id=>"/api/rooms/"+encodeURIComponent(id);

async function loadList(){
  let rows=[];try{rows=await api("/api/rooms");}catch(e){$("note").textContent=L().noServer+e.message;return;}
  const box=$("list");box.textContent="";
  if(!rows.length){const d=document.createElement("div");d.className="empty";d.style.padding="20px";d.textContent=L().none;box.appendChild(d);}
  for(const r of rows){const b=document.createElement("button");b.className="item"+(r.id===cur?" on":"")+(r.closed?" closed":"");b.textContent=r.title;
    const s=document.createElement("small");s.textContent=(r.closed?L().meetings.closed:L().meetings.open)+" · "+r.created.slice(5,16).replace("T"," ")+" · "+r.count+L().meetings.msgs;
    b.appendChild(s);b.onclick=()=>open(r.id);box.appendChild(b);}
}

function whoName(w){return w==="user"?L().host:w==="system"?L().system:w;}
function add(m){
  const log=$("log");if(log.querySelector(".empty"))log.textContent="";
  const box=document.createElement("div");box.className="msg m-"+m.who;
  const meta=document.createElement("div");meta.className="meta";
  const w=document.createElement("span");w.className="who";w.textContent=whoName(m.who);
  const t=document.createElement("span");t.className="time";t.textContent=hm(m.at);meta.append(w,t);
  const body=document.createElement("div");body.className="body"+(/^(【小結】|\[SUMMARY\])/m.test(m.text)?" sum":"");body.textContent=m.text;
  for(const f of m.imgs||[]){const a=document.createElement("a");a.href="/files/"+encodeURIComponent(cur)+"/"+encodeURIComponent(f);a.target="_blank";a.rel="noopener";
    const im=document.createElement("img");im.src=a.href;im.alt=m.who;a.appendChild(im);body.appendChild(a);}
  box.append(meta,body);
  if(m.who==="user"){const ack=document.createElement("div");ack.className="ack";ack.dataset.seq=m.seq;box.appendChild(ack);}
  log.appendChild(box);
  if(SEQS[m.who])SEQS[m.who].push(m.seq);
}
function refreshAcks(){
  document.querySelectorAll(".ack").forEach(a=>{const q=+a.dataset.seq;a.textContent="";
    for(const s of curSeats){const ok=(SEQS[s]||[]).some(x=>x>q);const sp=document.createElement("span");sp.className=ok?"ok":"wait";sp.textContent=s+(ok?L().replied:L().pending);a.appendChild(sp);}});
}
function renderSeats(j){
  const box=$("seats");box.textContent="";
  for(const s of curSeats){const el=document.createElement("span");el.className="seat "+j.seats[s];
    const i=document.createElement("i");const sm=document.createElement("small");sm.textContent=j.labels[s];
    el.append(i,document.createTextNode(s+" · "+L().state[j.seats[s]]+" "),sm);box.appendChild(el);}
}

async function poll(){
  if(!cur)return;
  try{
    const j=await api(R(cur)+"/messages?after="+last);
    const log=$("log");const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<80;
    curMeta=j.meta;curSeats=Object.keys(j.seats);for(const s of curSeats)SEQS[s]=SEQS[s]||[];
    j.messages.forEach(add);last=j.last_seq;refreshAcks();
    if(j.messages.length&&atBottom)log.scrollTop=log.scrollHeight;
    closed=!!j.meta.closed;renderSeats(j);
    $("closeBtn").hidden=closed;$("cfgBtn").hidden=closed;$("say").disabled=closed;$("send").disabled=closed;
    $("recall").hidden=closed||!Object.values(j.seats).includes("away");
    $("note").textContent=closed?(j.meta.export?L().noteSaved(j.meta.export):L().noteClosed):(j.ai_run>=j.ai_limit?L().noteRun(j.ai_run):L().noteLive);
  }catch(e){$("note").textContent=L().noServer+e.message;}
}
async function open(id){
  cur=id;last=0;$("log").textContent="";clearInterval(timer);for(const k in SEQS)delete SEQS[k];
  try{const j=await api(R(id)+"/messages?after=0");const m=j.meta;
    $("title").textContent=m.title;$("topic").hidden=false;$("topic").textContent=m.topic;
    const inf=$("info");inf.hidden=false;inf.textContent="";
    const rows=[[L().info.project,m.project],[L().info.type,L().modes[m.mode]||m.mode],[L().info.role,m.lead?L().leads(m.lead):L().equal]];
    if(m.branch)rows.push([L().info.copy,m.worktree+" ("+m.branch+")"]);
    for(const[k,v]of rows){const s=document.createElement("span");const b=document.createElement("b");b.textContent=k+": ";s.append(b,v||"—");inf.appendChild(s);}
  }catch(e){}
  await poll();$("log").scrollTop=$("log").scrollHeight;timer=setInterval(poll,1500);loadList();
  try{history.replaceState(null,"","#"+encodeURIComponent(id));}catch(e){}
}

async function send(){
  const text=$("say").value.trim();if(!text||!cur)return;$("send").disabled=true;
  try{await post(R(cur)+"/messages",{text});$("say").value="";await poll();$("log").scrollTop=$("log").scrollHeight;}
  catch(e){$("note").textContent=e.message;}
  $("send").disabled=closed;
}
$("send").onclick=send;
$("say").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();send();}});
$("closeBtn").onclick=async()=>{const b=$("closeBtn");if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent=L().closeSure;setTimeout(()=>{b.dataset.arm="";b.textContent=L().close;},4000);return;}
  await post(R(cur)+"/close");b.dataset.arm="";b.textContent=L().close;poll();loadList();};
$("recall").onclick=async()=>{for(const el of $("seats").children){if(el.classList.contains("away")){const s=el.textContent.split(" ")[0];try{await post(R(cur)+"/seat",{seat:s});}catch(e){$("note").textContent=s+": "+e.message;}}}poll();};
function seatPicker(s,cfg,withCheck,agent){
  const M=MODELS[s],fs=document.createElement("fieldset");fs.dataset.seat=s;
  const lg=document.createElement("legend");
  if(withCheck){const lb=document.createElement("label");lb.className="chk";const cb=document.createElement("input");cb.type="checkbox";cb.className="inv";
    cb.checked=!!(agent&&agent.installed);cb.disabled=!(agent&&agent.installed);lb.append(cb,document.createTextNode(" "+s));lg.appendChild(lb);
    cb.onchange=()=>{fs.classList.toggle("off",!cb.checked);syncLead();};}
  else lg.textContent=s;
  fs.appendChild(lg);
  if(withCheck&&!(agent&&agent.installed)){fs.classList.add("off");const p=document.createElement("p");p.className="hint";p.textContent=L().notInstalled+" — "+agent.hint;fs.appendChild(p);return fs;}
  if(withCheck&&agent&&!agent.signed_in){const p=document.createElement("p");p.className="hint";p.textContent=L().notSigned+" — "+agent.hint;fs.appendChild(p);}
  if(withCheck&&agent&&agent.needs_allow){const cb=fs.querySelector("input.inv");cb.checked=false;cb.disabled=true;fs.classList.add("off");
    const p=document.createElement("p");p.className="hint";p.textContent=L().allowNote;const b=document.createElement("button");b.type="button";b.className="ghost";b.textContent=L().allowBtn;
    b.onclick=async()=>{b.disabled=true;try{await post("/api/agy-allow");cb.disabled=false;cb.checked=true;fs.classList.remove("off");p.remove();b.remove();syncLead();}catch(e){p.textContent=e.message;b.disabled=false;}};
    fs.append(p,b);}
  const l1=document.createElement("label");l1.className="s";l1.textContent=L().model;const sm=document.createElement("select");sm.className="m";
  const dflt=M.default||{model:"",effort:""};
  opt(sm,M.models.map(m=>[m.id,(m.id?m.label:L().dflt)+(m.id&&m.id===dflt.model?" ("+L().dflt+")":"")]),cfg.model||dflt.model||"");
  fs.append(l1,sm);
  const se=document.createElement("select");se.className="e";
  const effs=()=>{if(s==="GPT"){const m=M.models.find(x=>x.id===sm.value);return m?m.efforts:["low","medium","high"];}return M.efforts||[];};
  const sync=()=>{const list=effs();if(!list.length){se.hidden=true;l2.hidden=true;return;}se.hidden=false;l2.hidden=false;
    opt(se,[["",L().dflt]].concat(list.map(e=>[e,EFF[LANG][e]||e])),se.value||cfg.effort||dflt.effort||"");};
  const l2=document.createElement("label");l2.className="s";l2.textContent=L().effort;fs.append(l2,se);
  sm.onchange=sync;sync();
  return fs;
}
function readPickers(box){const out={};box.querySelectorAll("fieldset").forEach(fs=>{const m=fs.querySelector("select.m"),e=fs.querySelector("select.e");
  if(m)out[fs.dataset.seat]={model:m.value,effort:e&&!e.hidden?e.value:""};});return out;}
function invited(){return[...$("invite").querySelectorAll("fieldset")].filter(fs=>{const c=fs.querySelector("input.inv");return c&&c.checked;}).map(fs=>fs.dataset.seat);}
function syncLead(){const keep=$("f-lead").value;opt($("f-lead"),[["",L().equal]].concat(invited().map(s=>[s,L().leads(s)])),keep);}

$("newBtn").onclick=async()=>{
  $("f-err").textContent="";$("f-lang").value=LANG;
  try{[MODELS,AGENTS]=await Promise.all([api("/api/models"),api("/api/agents")]);
    const box=$("invite");box.textContent="";for(const s of ALL)box.appendChild(seatPicker(s,{},true,AGENTS[s]));syncLead();
    const ps=await api("/api/projects");const sel=$("f-proj");
    opt(sel,ps.map(p=>[p.path,p.name+"  ("+p.path+")"]).concat([["__other",L().other]]),sel.value||(ps[0]&&ps[0].path)||"__other");
    sel.onchange=()=>{$("f-proj-other").hidden=sel.value!=="__other";};sel.onchange();
  }catch(e){$("f-err").textContent=e.message;}
  $("dlg").showModal();$("f-title").focus();
};
$("cancel").onclick=()=>$("dlg").close();
$("form").addEventListener("submit",async e=>{e.preventDefault();
  const seats=invited();if(!seats.length){$("f-err").textContent=L().needAI;return;}
  const cfg=readPickers($("invite"));$("go").disabled=true;
  try{const j=await post("/api/rooms",{title:$("f-title").value,topic:$("f-topic").value,seats,seat_cfg:cfg,lang:$("f-lang").value,
      project:$("f-proj").value==="__other"?$("f-proj-other").value:$("f-proj").value,mode:$("f-mode").value,lead:$("f-lead").value});
    $("dlg").close();$("f-title").value="";$("f-topic").value="";await open(j.id);}
  catch(err){$("f-err").textContent=err.message;}
  $("go").disabled=false;
});
$("cfgBtn").onclick=async()=>{$("c-err").textContent="";
  try{MODELS=MODELS||await api("/api/models");const box=$("cfgSeats");box.textContent="";const sc=(curMeta&&curMeta.seat_cfg)||{};
    for(const s of curSeats)box.appendChild(seatPicker(s,sc[s]||{},false));}catch(e){$("c-err").textContent=e.message;}
  $("dlg2").showModal();};
$("cancel2").onclick=()=>$("dlg2").close();
$("form2").addEventListener("submit",async e=>{e.preventDefault();$("go2").disabled=true;
  const want=readPickers($("cfgSeats")),sc=(curMeta&&curMeta.seat_cfg)||{};
  const eff=(s,c)=>{const d=(MODELS[s]&&MODELS[s].default)||{};return{model:(c&&c.model)||d.model||"",effort:(c&&c.effort)||d.effort||""};};
  try{for(const s of curSeats){const b=eff(s,sc[s]),w=want[s]&&eff(s,want[s]);if(w&&(w.model!==b.model||w.effort!==b.effort)){
      await post(R(cur)+"/seat",{seat:s,cfg:w});}}$("dlg2").close();poll();}
  catch(err){$("c-err").textContent=err.message;}
  $("go2").disabled=false;});

applyLang();
api("/api/info").then(i=>{if(i.host_name&&i.host_name!==I18N["zh-TW"].host){const z=I18N["zh-TW"];z.say=z.say.replace(z.host,i.host_name);z.host=i.host_name;if(LANG!=="en")applyLang();}}).catch(()=>{});
const h=decodeURIComponent(location.hash.slice(1));if(h)open(h);
setInterval(loadList,10000);
</script>
</body></html>
